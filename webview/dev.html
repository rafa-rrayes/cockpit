<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Cockpit preview</title>
  <!-- The variables VS Code puts on a webview's <html>, with the values of Dark Modern and Light Modern,
       so the page previews in a browser as it looks in the editor. -->
  <style>
    body.vscode-dark {
      --vscode-font-family: -apple-system, BlinkMacSystemFont, "Segoe WPC", "Segoe UI", system-ui, sans-serif;
      --vscode-font-size: 13px;
      --vscode-font-weight: normal;
      --vscode-editor-font-family: Menlo, Monaco, "Courier New", monospace;
      --vscode-editor-font-size: 12px;
      --vscode-foreground: #cccccc;
      --vscode-descriptionForeground: #9d9d9d;
      --vscode-disabledForeground: rgba(204, 204, 204, 0.5);
      --vscode-errorForeground: #f85149;
      --vscode-editor-background: #1f1f1f;
      --vscode-editor-foreground: #cccccc;
      --vscode-editorWidget-background: #202020;
      --vscode-widget-border: #313131;
      --vscode-widget-shadow: rgba(0, 0, 0, 0.36);
      --vscode-panel-border: #2b2b2b;
      --vscode-sideBar-background: #181818;
      --vscode-focusBorder: #0078d4;
      --vscode-badge-background: #616161;
      --vscode-badge-foreground: #f8f8f8;
      --vscode-button-background: #0078d4;
      --vscode-button-foreground: #ffffff;
      --vscode-button-hoverBackground: #026ec1;
      --vscode-button-border: rgba(255, 255, 255, 0.07);
      --vscode-button-secondaryBackground: #313131;
      --vscode-button-secondaryForeground: #cccccc;
      --vscode-button-secondaryHoverBackground: #3c3c3c;
      --vscode-list-hoverBackground: #2a2d2e;
      --vscode-toolbar-hoverBackground: rgba(90, 93, 94, 0.31);
      --vscode-textLink-foreground: #4daafc;
      --vscode-textLink-activeForeground: #4daafc;
      --vscode-textCodeBlock-background: #2b2b2b;
      --vscode-inputOption-activeBackground: rgba(36, 137, 219, 0.51);
      --vscode-inputOption-activeBorder: #2488db;
      --vscode-inputOption-activeForeground: #ffffff;
      --vscode-checkbox-background: #313131;
      --vscode-checkbox-border: #3c3c3c;
      --vscode-progressBar-background: #0078d4;
      --vscode-editorWarning-foreground: #cca700;
      --vscode-charts-foreground: #cccccc;
      --vscode-charts-blue: #3794ff;
      --vscode-charts-green: #89d185;
      --vscode-charts-yellow: #cca700;
      --vscode-charts-red: #f14c4c;
      --vscode-charts-orange: #d18616;
      --vscode-charts-purple: #b180d7;
      --vscode-testing-iconPassed: #73c991;
      --vscode-testing-iconFailed: #f14c4c;
      --vscode-testing-iconQueued: #cca700;
      --vscode-scrollbarSlider-background: rgba(121, 121, 121, 0.4);
      --vscode-scrollbarSlider-hoverBackground: rgba(100, 100, 100, 0.7);
    }
    body.vscode-light {
      --vscode-font-family: -apple-system, BlinkMacSystemFont, "Segoe WPC", "Segoe UI", system-ui, sans-serif;
      --vscode-font-size: 13px;
      --vscode-font-weight: normal;
      --vscode-editor-font-family: Menlo, Monaco, "Courier New", monospace;
      --vscode-editor-font-size: 12px;
      --vscode-foreground: #3b3b3b;
      --vscode-descriptionForeground: #3b3b3b;
      --vscode-disabledForeground: rgba(97, 97, 97, 0.5);
      --vscode-errorForeground: #f85149;
      --vscode-editor-background: #ffffff;
      --vscode-editor-foreground: #3b3b3b;
      --vscode-editorWidget-background: #f8f8f8;
      --vscode-widget-border: #e5e5e5;
      --vscode-widget-shadow: rgba(0, 0, 0, 0.16);
      --vscode-panel-border: #e5e5e5;
      --vscode-sideBar-background: #f8f8f8;
      --vscode-focusBorder: #005fb8;
      --vscode-badge-background: #cccccc;
      --vscode-badge-foreground: #3b3b3b;
      --vscode-button-background: #005fb8;
      --vscode-button-foreground: #ffffff;
      --vscode-button-hoverBackground: #0258a8;
      --vscode-button-border: rgba(0, 0, 0, 0.1);
      --vscode-button-secondaryBackground: #e5e5e5;
      --vscode-button-secondaryForeground: #3b3b3b;
      --vscode-button-secondaryHoverBackground: #cccccc;
      --vscode-list-hoverBackground: #f2f2f2;
      --vscode-toolbar-hoverBackground: rgba(184, 184, 184, 0.31);
      --vscode-textLink-foreground: #005fb8;
      --vscode-textLink-activeForeground: #005fb8;
      --vscode-textCodeBlock-background: #f8f8f8;
      --vscode-inputOption-activeBackground: #bed6ed;
      --vscode-inputOption-activeBorder: #005fb8;
      --vscode-inputOption-activeForeground: #000000;
      --vscode-checkbox-background: #f8f8f8;
      --vscode-checkbox-border: #cecece;
      --vscode-progressBar-background: #005fb8;
      --vscode-editorWarning-foreground: #bf8803;
      --vscode-charts-foreground: #616161;
      --vscode-charts-blue: #1a85ff;
      --vscode-charts-green: #388a34;
      --vscode-charts-yellow: #bf8803;
      --vscode-charts-red: #e51400;
      --vscode-charts-orange: #d18616;
      --vscode-charts-purple: #652d90;
      --vscode-testing-iconPassed: #388a34;
      --vscode-testing-iconFailed: #f14c4c;
      --vscode-testing-iconQueued: #cca700;
      --vscode-scrollbarSlider-background: rgba(100, 100, 100, 0.4);
      --vscode-scrollbarSlider-hoverBackground: rgba(100, 100, 100, 0.7);
    }
    .dev-error { padding: 24px; color: var(--vscode-errorForeground); font-family: var(--vscode-font-family); }
  </style>
  <link rel="stylesheet" href="webview.css" />
</head>
<body>
  <div id="root"></div>
  <script src="dev.js"></script>
</body>
</html>
